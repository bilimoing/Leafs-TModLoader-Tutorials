name: 校验评论数据
on:
  pull_request:
    paths:
      - 'Comments/**'
      - 'Pages/MD/**'
      - 'scripts/comments*'
      - 'scripts/comment-workflow.test.cjs'
      - 'scripts/create-comment-pr.cjs'
      - '.github/workflows/comments-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test scripts/comments.test.cjs scripts/comment-workflow.test.cjs
      - run: node scripts/comments.cjs
