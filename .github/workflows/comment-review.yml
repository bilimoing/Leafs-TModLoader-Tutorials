name: 审核评论并生成 PR
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: comment-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  create-pr:
    if: github.event.label.name == '评论审核通过' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: 检出默认分支的可信脚本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 校验并生成评论 PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/create-comment-pr.cjs');
            await run({ github, context, core });
