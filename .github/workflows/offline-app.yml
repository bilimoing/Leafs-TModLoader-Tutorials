name: 构建离线应用
on:
  workflow_dispatch:
  push:
    tags: ['offline-v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建完整离线网站
        run: |
          dotnet publish 叶子的TModLoader教程.csproj -c Release -o release
          node scripts/prepare-offline.mjs release/wwwroot
          node --test scripts/offline.test.cjs
      - name: 构建 Windows 安装包
        working-directory: offline-app/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: offline-windows
          path: offline-app/windows/dist/LeafTutorials-Windows-x64-Setup.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Android 工具链
        run: |
          dotnet workload install android
          dotnet build offline-app/android/LeafTutorials.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: 构建完整离线网站
        run: |
          dotnet publish 叶子的TModLoader教程.csproj -c Release -o release
          node scripts/prepare-offline.mjs release/wwwroot
          node --test scripts/offline.test.cjs
      - name: 准备正式签名
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && ( -z "$KEYSTORE" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ) ]]; then
            echo '正式发布需完整配置 Android 签名 Secrets。'
            exit 1
          fi
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/leaf.keystore"
          fi
      - name: 构建 APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            dotnet publish offline-app/android/LeafTutorials.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/leaf.keystore" -p:AndroidSigningKeyAlias="$KEY_ALIAS" -p:AndroidSigningStorePass=env:STORE_PASSWORD -p:AndroidSigningKeyPass=env:KEY_PASSWORD
          else
            dotnet build offline-app/android/LeafTutorials.Android.csproj -c Debug -p:AndroidSdkDirectory="$ANDROID_HOME"
          fi
          mkdir -p artifacts
          find offline-app/android/bin -name '*-Signed.apk' -print -quit | xargs -I '{}' cp '{}' artifacts/LeafTutorials-Android.apk
          test -s artifacts/LeafTutorials-Android.apk
      - name: 清理签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/leaf.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-android
          path: artifacts/LeafTutorials-Android.apk
          if-no-files-found: error
  release-draft:
    if: startsWith(github.ref, 'refs/tags/offline-v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          merge-multiple: true
          path: artifacts
      - name: 创建待检查的发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "教程离线版 $GITHUB_REF_NAME" --notes "完整离线教程。请完成 Windows 和 Android 断网验收后发布此草稿。" artifacts/*
